[project]
name = "seeself"
version = "0.1.0"
description = "个人五年计划管理系统：五年计划 → 季度 OKR → 项目 → 待办，量化监控时间流逝与任务推进"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastmcp>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeself"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/seeself/tests"]

[tool.uv]
package = true
